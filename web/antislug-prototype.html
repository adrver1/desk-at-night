<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anti-slug Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Full-screen view; a compact dock of switches along the bottom. One dark look on purpose. */
  :root { --ink: #eef3f4; --dim: #9fb3ba; --panel: rgba(6, 14, 18, 0.72); --line: rgba(238, 243, 244, 0.22); --on: #f2b544; --on-ink: #10161a;
    --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: 'Instrument Sans', system-ui, sans-serif; color-scheme: dark; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0b1216; color: var(--ink); }
  canvas#view { display: block; width: 100%; height: 100%; touch-action: none; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: grid; gap: 6px; font: 13px/1.2 var(--sans); }
  .row { display: flex; gap: 5px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .lab { font: 500 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); min-width: 58px; flex: none; }
  button { flex: none; font: 500 12.5px/1 var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 11px; cursor: pointer; }
  button.on { background: var(--on); color: var(--on-ink); border-color: var(--on); }
  button:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
  #note { font: 400 11px/1.4 var(--mono); color: var(--dim); }
  #note b { color: var(--ink); font-weight: 500; }
  #tag { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 100%; font: 500 11px/1.3 var(--mono);
    color: var(--ink); text-shadow: 0 1px 3px #000; pointer-events: none; }
  .lbl { position: fixed; left: 0; top: 0; font: 500 11px/1.2 var(--sans); color: var(--ink); background: rgba(6,14,18,0.6); padding: 3px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap; transform: translate(-50%, -50%); transition: opacity .3s; }
  #hud { position: fixed; left: 0; right: 0; top: 0; background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: max(6px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  #trend { width: 100%; height: 104px; display: block; }
  #levels { width: 100%; height: 78px; display: block; margin-top: 2px; }
  /* wide screens: the trends move into a column on the right, beside the scene */
  @media (min-aspect-ratio: 5/4) and (min-width: 700px) {
    #hud { left: auto; right: 0; width: min(380px, 34vw); box-sizing: border-box; padding-top: max(10px, env(safe-area-inset-top, 0px)); overflow-y: auto; }
    #trend { height: 170px; } #levels { height: 130px; margin-top: 10px; }
    #stats { margin-top: 10px; gap: 6px; }
    #hud { bottom: 0; } #dock { right: min(380px, 34vw); }
  }
  @media (max-height: 500px) { #note { display: none; } #trend { height: 120px; } #levels { height: 90px; } }
  #stats { font: 400 11px/1.35 var(--mono); color: var(--dim); display: grid; gap: 3px; margin-top: 4px; }
  #stats b { color: var(--ink); font-weight: 500; }
  .bar { position: relative; height: 8px; border-radius: 4px; background: rgba(238,243,244,0.12); overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transition: width .4s; }
  .bar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .7; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px var(--mono); color: var(--dim); }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"><canvas id="trend"></canvas><canvas id="levels"></canvas><div id="stats"></div></div>
<div id="tag"></div>
<div id="status">Loading…</div>
<div id="dock">
  <div id="ui" style="display:grid;gap:6px"></div>
  <div id="note"></div>
</div>
<script type="module" src="./src/antislugPrototype.js"></script>
</body>
</html>
