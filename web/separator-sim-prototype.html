<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Separator Sim Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Full-screen vessel, trends beside it on wide screens and under it on phones, switches along the bottom. One dark look on purpose. */
  :root { --ink: #eef3f4; --dim: #9fb3ba; --panel: rgba(6, 14, 18, 0.78); --line: rgba(238, 243, 244, 0.22); --on: #f2b544; --on-ink: #10161a;
    --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: 'Instrument Sans', system-ui, sans-serif; color-scheme: dark; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0b1216; color: var(--ink); }
  #wrap { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto auto; }
  #view { position: relative; min-height: 0; }
  canvas#gl { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px 12px; background: var(--panel); }
  #hud canvas { width: 100%; height: 92px; display: block; }
  @media (min-width: 900px) {
    #wrap { grid-template-columns: 1fr 380px; grid-template-rows: 1fr auto; }
    #view { grid-column: 1; grid-row: 1; }
    #hud { grid-column: 2; grid-row: 1; grid-template-columns: 1fr; align-content: start; overflow-y: auto; padding: 12px; }
    #hud canvas { height: 128px; }
    #dock { grid-column: 1 / 3; }
  }
  #read { grid-column: 1 / -1; font: 400 11px/1.45 var(--mono); color: var(--dim); }
  #read b { color: var(--ink); font-weight: 500; }
  #dock { background: var(--panel); padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: grid; gap: 6px; font: 13px/1.2 var(--sans); }
  .row { display: flex; gap: 5px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row[hidden] { display: none; }
  .lab { font: 500 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); min-width: 58px; flex: none; }
  button { flex: none; font: 500 12.5px/1 var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 11px; cursor: pointer; }
  button.on { background: var(--on); color: var(--on-ink); border-color: var(--on); }
  button:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
  #tag { position: absolute; left: 12px; top: max(12px, env(safe-area-inset-top, 0px)); font: 500 11px/1.4 var(--mono); color: var(--ink); text-shadow: 0 1px 3px #000; pointer-events: none; max-width: 70ch; }
  #tag span { color: var(--dim); }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px var(--mono); color: var(--dim); }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view"><canvas id="gl"></canvas><div id="tag"></div></div>
  <div id="hud"><div id="read"></div></div>
  <div id="dock"><div id="ui" style="display:grid;gap:6px"></div></div>
</div>
<div id="status">Loading…</div>
<script type="module" src="./src/separatorSimPrototype.js"></script>
</body>
</html>
